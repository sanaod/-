    <script>
      // Ignore WebSocket / HMR connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        var file = (event && (event.filename || '')) + '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('transport') ||
          file.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('transport') ||
          msg.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
