    <script>
      // Filter out Vite HMR WebSocket noise in AI Studio cloud iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr') isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                readyState: 1, // WebSocket.OPEN
                url: String(url),
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        listener({ type: 'open', target: mockSocket });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              return mockSocket;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var isHmrNoise = function(str, file) {
          if (!str) str = '';
          if (!file) file = '';
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('ws:disconnect') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            file.indexOf('@vite/client') !== -1
          );
        };

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(item) {
            return (item && (item.message || item.stack || String(item))) || '';
          }).join(' ');

          if (isHmrNoise(str)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(item) {
            return (item && (item.message || item.stack || String(item))) || '';
          }).join(' ');

          if (isHmrNoise(str)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) + '';
          var file = (event && (event.filename || '')) + '';
          var errorStr = (event && event.error && (event.error.message || event.error.stack || String(event.error))) || '';
          if (isHmrNoise(msg, file) || isHmrNoise(errorStr, file)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isHmrNoise(msg)) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);
      })();
    </script>
